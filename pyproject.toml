[build-system]
requires = ["uv_build==0.10.8"]
build-backend = "uv_build"

[project]
name = "lae-simulator"
version = "0.1.0"
description = "Reproducible synthetic issue simulation foundation"
readme = "README.md"
requires-python = "==3.14.8"
dependencies = [
    "google-genai==3.0.0",
    "openai==3.46.0",
    "pydantic==2.14.3",
]

[project.scripts]
lae-sim = "lae_simulator.cli:main"

[tool.uv]
package = true


[tool.mypy]
python_executable = ".venv/bin/python"
